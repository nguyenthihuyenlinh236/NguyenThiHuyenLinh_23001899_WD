<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }

        button {
            padding: 9px 14px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        button:disabled {
            background: #d1d5db;
            color: #4b5563;
            cursor: not-allowed;
        }

        [v-cloak] {
            display: none;
        }

        .container {
            max-width: 900px;
            margin: 24px auto;
            padding: 24px;
            background: white;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        .cart-item {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .product-info {
            flex: 1;
            min-width: 160px;
        }

        .product-info h2 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .product-info p {
            margin: 0;
            color: #6b7280;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quantity {
            min-width: 24px;
            text-align: center;
        }

        .item-total {
            min-width: 140px;
            text-align: right;
            color: #2563eb;
        }

        .delete-button {
            background: #dc2626;
        }

        .summary {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            background: #eff6ff;
            text-align: right;
        }

        .summary p {
            margin: 8px 0;
        }

        .grand-total {
            font-size: 22px;
            color: #2563eb;
        }

        .empty {
            padding: 40px 16px;
            text-align: center;
            background: #f9fafb;
            color: #6b7280;
            border-radius: 8px;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 600px) {
            .product-info {
                flex-basis: 100%;
            }

            .item-total {
                min-width: 0;
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <main id="app" class="container" v-cloak>
        <h1>Giỏ hàng văn phòng phẩm</h1>

        <p class="error" v-if="thongBaoLoi">
            {{ thongBaoLoi }}
        </p>

        <p class="empty" v-if="gioHang.length === 0">
            Giỏ hàng trống
        </p>

        <section v-else aria-label="Các sản phẩm trong giỏ">
            <dong-gio-hang v-for="sp in gioHang" :key="sp.id" :id="sp.id" :ten="sp.ten" :don-gia="sp.donGia"
                :so-luong="sp.soLuong" @doi-so-luong="capNhatSoLuong" @yeu-cau-xoa="xoaSanPham"></dong-gio-hang>
        </section>

        <div class="summary">
            <p>
                Tổng số lượng:
                <strong>{{ tongSoLuong }}</strong>
            </p>

            <p class="grand-total">
                Tổng tiền:
                <strong>{{ dinhDangTien(tongTien) }}</strong>
            </p>
        </div>
    </main>

    <!-- Nạp Vue và component trước khi tạo ứng dụng -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./components/DongGioHang.js"></script>

    <script>
        const app = Vue.createApp({
            data() {
                return {
                    thongBaoLoi: "",

                    gioHang: [
                        {
                            id: 1,
                            ten: "Bút bi",
                            donGia: 5000,
                            soLuong: 2
                        },
                        {
                            id: 2,
                            ten: "Vở ô ly",
                            donGia: 12000,
                            soLuong: 3
                        }
                    ]
                };
            },

            computed: {
                tongSoLuong() {
                    return this.gioHang.reduce(
                        (tong, sp) => tong + sp.soLuong,
                        0
                    );
                },

                tongTien() {
                    return this.gioHang.reduce(
                        (tong, sp) => tong + sp.donGia * sp.soLuong,
                        0
                    );
                }
            },

            methods: {
                capNhatSoLuong(id, soLuongMoi) {
                    this.thongBaoLoi = "";

                    // Cha kiểm tra sản phẩm có tồn tại.
                    const sanPham = this.gioHang.find(
                        sp => sp.id === id
                    );

                    if (!sanPham) {
                        this.thongBaoLoi = "Không tìm thấy sản phẩm.";
                        return;
                    }

                    // Cha kiểm tra số lượng trước khi cập nhật.
                    if (
                        !Number.isInteger(soLuongMoi)
                        || soLuongMoi < 1
                        || soLuongMoi > 99
                    ) {
                        this.thongBaoLoi =
                            "Số lượng phải là số nguyên từ 1 đến 99.";
                        return;
                    }

                    // Chỉ component cha sửa dữ liệu giỏ hàng.
                    sanPham.soLuong = soLuongMoi;
                },

                xoaSanPham(id) {
                    this.thongBaoLoi = "";

                    const sanPham = this.gioHang.find(
                        sp => sp.id === id
                    );

                    if (!sanPham) {
                        this.thongBaoLoi = "Không tìm thấy sản phẩm.";
                        return;
                    }

                    this.gioHang = this.gioHang.filter(
                        sp => sp.id !== id
                    );
                },

                dinhDangTien(giaTri) {
                    return giaTri.toLocaleString("vi-VN") + " đồng";
                }
            }
        });

        app.component("dong-gio-hang", DongGioHang);

        app.mount("#app");
    </script>
</body>

</html>
